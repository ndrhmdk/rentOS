# rentOS host alert rules.
# Confirm chart and dimension names against the installed Netdata agent
# before relying on these thresholds in production.
# Deploy with: infrastructure/netdata/deploy.sh

 alarm: rentos_cpu_usage
    on: system.cpu
lookup: average -5m unaligned percentage of user,system
 units: %
 every: 1m
  warn: $this > 85
  crit: $this > 95
  info: Sustained CPU usage over five minutes
    to: sysadmin

 alarm: rentos_ram_usage
    on: system.ram
lookup: average -5m percentage of used
 units: %
 every: 1m
  warn: $this > 85
  crit: $this > 95
  info: Sustained memory usage over five minutes
    to: sysadmin

# Chart name may vary by Netdata version. Confirm with the agent dashboard
# (commonly disk_space./ or disk.space). Adjust `on:` after install if needed.
 alarm: rentos_disk_space
    on: disk_space./
lookup: average -5m percentage of used
 units: %
 every: 1m
  warn: $this > 85
  crit: $this > 95
  info: Sustained root filesystem usage over five minutes
    to: sysadmin
